[tool.poetry]
name = "estissuer"
version = "0.0.1"
description = ""
authors = ["Timothy J. Miller <cerebus2@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.7"
kopf = "^1.35.4"
dacite = "^1.6.0"
dataclasses-json = "^0.5.7"
lightkube = "^0.11.0"

[tool.poetry.group.ide]
optional = true

[tool.poetry.group.ide.dependencies]
pyright = "^1.1.275"
black = "^22.10.0"
pyflakes = "^2.5.0"
isort = "^5.10.1"

[tool.poetry.group.dev.dependencies]
pytest = "^7.1.3"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
include = ["src"]
exclude = ["scratch"]
