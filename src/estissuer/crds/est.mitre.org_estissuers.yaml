---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: estissuers.est.mitre.org
spec:
  group: est.mitre.org
  names:
    kind: EstIssuer
    listKind: EstIssuerList
    plural: estissuers
    singular: estissuers
    shortNames:
      - "ests"
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          properties:
            spec:
              type: object
              properties:
                host:
                  type: string
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 443
                label:
                  type: string
                  default: ""
